<html xmlns:th="http://www.thymeleaf.org">
<body style="font-family: Arial; margin: 20px; background: #e8f5e8;">
    <h1 style="color: #2d5a2d;">Employees</h1>
    <a href="/employees/new" style="background: #4caf50; color: white; padding: 10px; text-decoration: none;">Add</a>
    <a href="/logout" style="background: #f44336; color: white; padding: 10px; text-decoration: none; margin-left: 10px;">Logout</a>
    <br><br>
    <table border="1" style="width: 100%; border-collapse: collapse;">
        <tr style="background: #4caf50; color: white;">
            <th style="padding: 10px;">ID</th>
            <th style="padding: 10px;">Name</th>
            <th style="padding: 10px;">Email</th>
            <th style="padding: 10px;">Action</th>
        </tr>
        <tr th:each="e : ${employees}">
            <td style="padding: 10px;" th:text="${e.id}"></td>
            <td style="padding: 10px;" th:text="${e.name}"></td>
            <td style="padding: 10px;" th:text="${e.email}"></td>
            <td style="padding: 10px;">
                <a th:href="@{/employees/edit/{id}(id=${e.id})}" style="color: #4caf50;">Edit</a> | 
                <a th:href="@{/employees/delete/{id}(id=${e.id})}" style="color: #f44336;">Delete</a>
            </td>
        </tr>
    </table>
</body>
</html>

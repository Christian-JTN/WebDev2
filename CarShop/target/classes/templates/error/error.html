<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Error</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f0f0f0; }
        h1 { color: #333; text-align: center; }
        .card { background: white; padding: 20px; margin: 20px auto; max-width: 400px; text-align: center; border-radius: 5px; }
        .btn { padding: 8px 16px; text-decoration: none; border-radius: 3px; color: white; background-color: #4CAF50; }
    </style>
</head>
<body>
    <h1 th:text="${errorType}">Error</h1>
    
    <div class="card">
        <p th:text="${message}">An unexpected error occurred.</p>
        <a href="/" class="btn">Back to Home</a>
    </div>
</body>
</html>

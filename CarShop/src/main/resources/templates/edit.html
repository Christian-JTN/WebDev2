<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Edit Car</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        form {
            background: white;
            padding: 20px;
            border-radius: 5px;
            max-width: 500px;
            margin: 0 auto;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 3px;
            box-sizing: border-box;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            font-size: 14px;
            margin-right: 10px;
        }
        .btn-primary {
            background-color: #4CAF50;
            color: white;
        }
        .btn-secondary {
            background-color: #f44336;
            color: white;
        }
        .buttons {
            text-align: center;
            margin-top: 20px;
        }
        .error {
            color: #d32f2f;
            font-size: 12px;
            margin-top: 5px;
            display: block;
        }
        .form-group input.error-field,
        .form-group select.error-field {
            border-color: #d32f2f;
        }
    </style>
</head>
<body>
    <h1>Edit Car</h1>
    
    <form action="/update" method="post" th:object="${carDTO}">
        <input type="hidden" name="carId" th:value="${carId}">
        
        <div class="form-group">
            <label for="make">Make:</label>
            <input type="text" id="make" th:field="*{make}" 
                   th:class="${#fields.hasErrors('make')} ? 'error-field'">
            <div th:if="${#fields.hasErrors('make')}" th:errors="*{make}" class="error"></div>
        </div>
        
        <div class="form-group">
            <label for="model">Model:</label>
            <input type="text" id="model" th:field="*{model}" 
                   th:class="${#fields.hasErrors('model')} ? 'error-field'">
            <div th:if="${#fields.hasErrors('model')}" th:errors="*{model}" class="error"></div>
        </div>
        
        <div class="form-group">
            <label for="year">Year:</label>
            <input type="number" id="year" th:field="*{year}" 
                   th:class="${#fields.hasErrors('year')} ? 'error-field'">
            <div th:if="${#fields.hasErrors('year')}" th:errors="*{year}" class="error"></div>
        </div>
        
        <div class="form-group">
            <label for="color">Color:</label>
            <input type="text" id="color" th:field="*{color}" 
                   th:class="${#fields.hasErrors('color')} ? 'error-field'">
            <div th:if="${#fields.hasErrors('color')}" th:errors="*{color}" class="error"></div>
        </div>
        
        <div class="form-group">
            <label for="bodyType">Body Type:</label>
            <select id="bodyType" th:field="*{bodyType}" 
                    th:class="${#fields.hasErrors('bodyType')} ? 'error-field'">
                <option value="">Select body type</option>
                <option value="Sedan">Sedan</option>
                <option value="SUV">SUV</option>
                <option value="Hatchback">Hatchback</option>
                <option value="Coupe">Coupe</option>
                <option value="Convertible">Convertible</option>
                <option value="Wagon">Wagon</option>
                <option value="Truck">Truck</option>
                <option value="Van">Van</option>
            </select>
            <div th:if="${#fields.hasErrors('bodyType')}" th:errors="*{bodyType}" class="error"></div>
        </div>
        
        <div class="form-group">
            <label for="engineType">Engine Type:</label>
            <select id="engineType" th:field="*{engineType}" 
                    th:class="${#fields.hasErrors('engineType')} ? 'error-field'">
                <option value="">Select engine type</option>
                <option value="Gasoline">Gasoline</option>
                <option value="Diesel">Diesel</option>
                <option value="Electric">Electric</option>
                <option value="Hybrid">Hybrid</option>
                <option value="Plug-in Hybrid">Plug-in Hybrid</option>
            </select>
            <div th:if="${#fields.hasErrors('engineType')}" th:errors="*{engineType}" class="error"></div>
        </div>
        
        <div class="form-group">
            <label for="licensePlate">License Plate:</label>
            <input type="text" id="licensePlate" th:field="*{licensePlate}" 
                   th:class="${#fields.hasErrors('licensePlate')} ? 'error-field'">
            <div th:if="${#fields.hasErrors('licensePlate')}" th:errors="*{licensePlate}" class="error"></div>
        </div>
        
        <div class="buttons">
            <button type="submit" class="btn btn-primary">Update</button>
            <a href="/" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</body>
</html>

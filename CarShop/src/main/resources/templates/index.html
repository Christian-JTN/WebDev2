<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Car Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        h1 {
            color: #333;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #4CAF50;
            color: white;
        }
        tr:nth-child(even) {
            background-color: #f2f2f2;
        }
        .btn {
            padding: 5px 10px;
            margin: 2px;
            text-decoration: none;
            border-radius: 3px;
            font-size: 12px;
        }
        .btn-edit {
            background-color: #ff9800;
            color: white;
        }
        .btn-delete {
            background-color: #f44336;
            color: white;
        }
        .btn-view {
            background-color: #2196F3;
            color: white;
        }
        .btn-add {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            font-size: 14px;
        }
        .actions {
            text-align: center;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <h1>Car Management System</h1>
    
    <div class="actions">
        <a href="/create" class="btn btn-add">Add New Car</a>
    </div>
    
    <table>
        <thead>
            <tr>
                <th>Make</th>
                <th>Model</th>
                <th>Year</th>
                <th>Color</th>
                <th>Body Type</th>
                <th>Engine Type</th>
                <th>License Plate</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="car: ${cars}">
                <td th:text="${car.make}"></td>
                <td th:text="${car.model}"></td>
                <td th:text="${car.year}"></td>
                <td th:text="${car.color}"></td>
                <td th:text="${car.bodyType}"></td>
                <td th:text="${car.engineType}"></td>
                <td th:text="${car.licensePlate}"></td>
                <td>
                    <a th:href="@{/view/{id}(id=${car.id})}" class="btn btn-view">View</a>
                    <a th:href="@{/edit/{id}(id=${car.id})}" class="btn btn-edit">Edit</a>
                    <a th:href="@{/delete/{id}(id=${car.id})}" class="btn btn-delete" 
                       onclick="return confirm('Delete this car?')">Delete</a>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
